apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: juanestebaneraso/notification-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
        envFrom:
        - configMapRef:
            name: circleguard-config
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service

spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8084
  type: ClusterIP
