apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-postgres
  template:
    metadata:
      labels:
        app: circleguard-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_DB
          value: "circleguard_form"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-postgres
spec:
  selector:
    app: circleguard-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-zookeeper
  template:
    metadata:
      labels:
        app: circleguard-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-zookeeper
spec:
  selector:
    app: circleguard-zookeeper
  ports:
    - protocol: TCP
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-kafka
  template:
    metadata:
      labels:
        app: circleguard-kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "circleguard-zookeeper:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://circleguard-kafka:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-kafka
spec:
  selector:
    app: circleguard-kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-ldap
  template:
    metadata:
      labels:
        app: circleguard-ldap
    spec:
      containers:
      - name: ldap
        image: osixia/openldap:1.5.0
        ports:
        - containerPort: 389
        env:
        - name: LDAP_ORGANISATION
          value: "CircleGuard"
        - name: LDAP_DOMAIN
          value: "circleguard.edu"
        - name: LDAP_ADMIN_PASSWORD
          value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-ldap
spec:
  selector:
    app: circleguard-ldap
  ports:
    - protocol: TCP
      port: 389
      targetPort: 389
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-redis
  template:
    metadata:
      labels:
        app: circleguard-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-redis
spec:
  selector:
    app: circleguard-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
