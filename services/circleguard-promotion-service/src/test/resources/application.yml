spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/test
  
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: "my-super-secret-test-key-32-chars-long-promotion-service-123456"

# Default values for all possible placeholders used in code
vault:
  hash-salt: "test-salt"
  secret: "test-secret"

# Story configurations
promotion:
  auto-threshold-seconds: 3600
  encounter-window-days: 14
