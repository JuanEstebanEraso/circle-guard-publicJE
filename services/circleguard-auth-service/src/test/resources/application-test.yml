spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

# Valores por defecto para que los tests no fallen buscando variables de entorno
jwt:
  secret: "test-secret-key-32-chars-long-123456"
  expiration: 3600000

ldap:
  host: localhost
  port: 389
  base: dc=circleguard,dc=edu

qr:
  secret: "test-qr-secret-key-32-chars-long-123456"
  expiration: 300
